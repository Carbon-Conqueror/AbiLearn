<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mind Maps</title>
<link rel="stylesheet" href="css/style.css?v=59">
<style>
.coming-wrap {
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:80vh;text-align:center;padding:2rem;gap:1rem;
}
.coming-icon { font-size:3.5rem; }
.coming-title { font-size:1.5rem;font-weight:800;color:var(--text);margin:0; }
.coming-sub { font-size:.9rem;color:var(--muted);max-width:340px;line-height:1.6; }
.coming-back { display:inline-block;margin-top:1rem;padding:.55rem 1.3rem;border-radius:20px;background:var(--accent);color:#fff;font-weight:700;font-size:.88rem;text-decoration:none; }
</style>
<style id="abl-protect">
*{-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important;}
input,textarea{-webkit-user-select:text!important;user-select:text!important;}
@media print{body{display:none!important;}}
</style>

<script>(function(){if(sessionStorage.getItem('abl_fs')==='1'){var e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen||e.mozRequestFullScreen||e.msRequestFullscreen;if(f)f.call(e).catch(function(){});}})();</script>
</head>
<body>
<div class="coming-wrap">
  <div class="coming-icon"></div>
  <h1 class="coming-title">Mind Maps</h1>
  <p class="coming-sub">Visual concept maps for every chapter — see the big picture at a glance. Coming soon!</p>
  <a class="coming-back" href="learn.html">← Back to Study Tools</a>
</div>
<script src="js/fullscreen.js?v=1"></script>

<script src="js/protect.js?v=2"></script>
<script src="js/community.js?v=1"></script>
  <script src="js/router.js?v=5"></script>
  <script src="js/pinch-zoom.js?v=2"></script>
</body>
</html>
