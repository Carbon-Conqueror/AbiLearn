name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - claude/cbse-class-10-website-DLe33

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CF Pages project (idempotent — no-ops if it already exists)
        run: |
          npx wrangler@3 pages project create abilearn \
            --production-branch main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: abilearn
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
